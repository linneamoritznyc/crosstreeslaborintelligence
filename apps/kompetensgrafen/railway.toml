[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/kompetensgrafen/Dockerfile"
watchPatterns = ["apps/kompetensgrafen/**", "libs/**", "pnpm-workspace.yaml", "package.json"]

[deploy]
startCommand = "node apps/kompetensgrafen/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
