name: Weekly Taxonomy Sync
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/data-pipeline/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r services/data-pipeline/requirements.txt
      - name: Kör pipeline (extract → transform → load → validate)
        run: python -m src.pipeline
        working-directory: services/data-pipeline
      - name: Validera graf
        run: python -m src.transform.validate
        working-directory: services/data-pipeline
      - name: Notifiera vid fel
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{"text":"⚠️ Crosstrees: Veckovis taxonomisynk misslyckades. Se RUNBOOK.md#taxonomy-sync-failure."}'
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      JONKOPING_LAN_CODE: '06'
