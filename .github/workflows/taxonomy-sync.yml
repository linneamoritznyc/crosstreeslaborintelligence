name: Weekly Taxonomy Sync
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/data-pipeline/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r services/data-pipeline/requirements.txt
      - run: python -m src.extract.taxonomy
        working-directory: services/data-pipeline
      - run: python -m src.transform.occupations
        working-directory: services/data-pipeline
      - run: python -m src.transform.skills
        working-directory: services/data-pipeline
      - run: python -m src.transform.substitutability
        working-directory: services/data-pipeline
      - run: python -m src.load.neo4j_loader
        working-directory: services/data-pipeline
      - run: python -m src.load.qdrant_loader
        working-directory: services/data-pipeline
      - run: python -m src.transform.validate
        working-directory: services/data-pipeline
      - name: Notifiera vid fel
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{"text":"⚠️ Crosstrees: Veckovis taxonomisynk misslyckades. Se RUNBOOK.md#taxonomy-sync-failure."}'
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
