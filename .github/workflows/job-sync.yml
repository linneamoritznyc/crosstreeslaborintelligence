name: Daily Job Sync
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/data-pipeline/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r services/data-pipeline/requirements.txt
      - run: python -m src.extract.jobs
        working-directory: services/data-pipeline
      - name: Notifiera vid fel
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{"text":"⚠️ Crosstrees: Daglig jobbsynk misslyckades. Se RUNBOOK.md#job-sync-failure."}'
    env:
      AF_JOBSEARCH_URL: ${{ secrets.AF_JOBSEARCH_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
